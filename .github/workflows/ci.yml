name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Type check
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install mypy==2.2.0
          mypy . --ignore-missing-imports
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Audit our own skill
        run: python skillrot.py SKILL.md --no-usage --portable --fail-on error
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Check the installed package outside the checkout
        run: python scripts/smoke_package.py dist
      - name: Build both skill delivery profiles
        run: |
          python scripts/build_skill_bundle.py --profile local --output-dir dist
          python scripts/build_skill_bundle.py --profile agensi --output-dir dist
      - name: Check extracted skill archives
        run: python -m unittest discover -s tests -p test_skill_bundle.py -v
