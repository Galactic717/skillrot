[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "skillrot"
version = "0.4.0"
description = "Audit Claude Code skill listing pressure, conflicts and frontmatter offline."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hlib Stepanov" }]
keywords = ["agent-skills", "claude-code", "claude-skills", "linter", "context", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Galactic717/skillrot"
Documentation = "https://github.com/Galactic717/skillrot#readme"
Source = "https://github.com/Galactic717/skillrot"
Issues = "https://github.com/Galactic717/skillrot/issues"

[project.scripts]
skillrot = "skillrot:main"

[tool.setuptools]
py-modules = ["skillrot"]
