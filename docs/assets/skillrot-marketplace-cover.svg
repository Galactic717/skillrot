<text x="143" y="89" fill="#ecf5ff" font-family="Arial,sans-serif" font-size="38" font-weight="700">skillrot</text>
<text x="80" y="180" fill="#f6f9ff" font-family="Arial,sans-serif" font-size="64" font-weight="700">Audit your skill library.</text>
<text x="83" y="227" fill="#bdccdf" font-family="Arial,sans-serif" font-size="24">Context estimates. Command conflicts. CI gates.</text>
<rect x="80" y="281" width="1040" height="211" rx="16" fill="#101b2c" stroke="#314158"/>
<circle cx="110" cy="309" r="5" fill="#fb918c"/><circle cx="128" cy="309" r="5" fill="#f7d68b"/><circle cx="146" cy="309" r="5" fill="#89edbc"/>
<text x="108" y="365" fill="#89edbc" font-family="Consolas,monospace" font-size="24">$</text>
<text x="137" y="365" fill="#e3edf9" font-family="Consolas,monospace" font-size="24">skillrot ./skills --no-usage --json</text>
<path d="M108 390H1091" stroke="#2e3f56"/>
