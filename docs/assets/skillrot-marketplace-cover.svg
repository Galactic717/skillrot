<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">skillrot — audit your skill library</title>
<desc id="desc">Promotional cover for the offline MIT Python tool. Context estimates, command conflicts and CI gates; no measured savings or live-routing claim.</desc>
