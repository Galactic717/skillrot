<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">skillrot</title>
  <desc id="desc">Three ascending mint bars on a dark navy tile, matching skillrot's audit report identity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14263c"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#b9ffda"/>
      <stop offset="1" stop-color="#76dea8"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#b4e8dc" stroke-opacity=".035" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" rx="120" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="120" fill="url(#grid)"/>
  <g fill="url(#mint)">
    <rect x="280" y="500" width="116" height="248" rx="30"/>
    <rect x="454" y="388" width="116" height="360" rx="30"/>
    <rect x="628" y="276" width="116" height="472" rx="30"/>
  </g>
</svg>
